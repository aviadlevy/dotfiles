# Only overrides — everything else inherits Yazi's built-in defaults.
# Scalar sections fall back to defaults per-key when omitted; rule lists use
# prepend_/append_ so new default rules keep flowing in on yazi upgrades.

[mgr]
ratio        = [ 2, 3, 4 ]
show_hidden  = true
title_format = "Yazi: {cwd}"

[open]
prepend_rules = [
	# Open HTML in the GUI default app (browser) rather than the editor.
	# `edit` stays reachable via interactive open (O / <S-Enter>).
	{ mime = "text/html", use = [ "open", "edit" ] },
]
